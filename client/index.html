<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reserve a seat for the campus workshop with live availability and a fair waitlist." />
    <meta name="theme-color" content="#f8f7f4" />
    <title>SeatLock — Workshop reservations</title>
    <script>
      (() => {
        const saved = localStorage.getItem('seatlock-theme');
        const dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
